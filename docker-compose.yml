# A single-node MongoDB replica set for local development.
#
# A plain `mongod` cannot start a session, so order placement would fall back
# to unwrapped writes and behave differently from production. This gives a
# laptop the same transaction support Atlas has.
#
#   docker compose up -d
#   npm run seed
services:
  mongo:
    image: mongo:7
    container_name: skincarevault-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once
      # the node has finished electing itself primary.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
